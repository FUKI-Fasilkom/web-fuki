{% if messages %}
<div class="fixed left-1/2 top-20 z-60 w-[calc(100%-2rem)] max-w-md -translate-x-1/2 space-y-2">
  {% for message in messages %}
  <div x-data="{ show: true }"
       x-init="setTimeout(() => show = false, 4000)"
       x-show="show"
       x-transition.opacity.duration.300ms
       class="rounded-xl border-[3px] border-[#3A3A3A] px-4 py-3 text-sm font-medium shadow-lg
              {% if message.tags == 'success' %}bg-[#FDFBF4] text-gray-800
              {% elif message.tags == 'error' %}bg-red-100 text-red-800
              {% else %}bg-[#F6FAEB] text-gray-800{% endif %}">
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}
