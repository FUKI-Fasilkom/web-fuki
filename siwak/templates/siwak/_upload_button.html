{# Tombol "Upload File" (Figma) membungkus <input type=file> yang disembunyikan. Param: field (bound field). Nama berkas terpilih tampil di sebelah tombol. #}
<div x-data="{ name: '' }" @change="name = $event.target.files[0] ? $event.target.files[0].name : ''" class="relative mt-2 flex flex-wrap items-center gap-3">
  <label class="inline-flex min-h-10 cursor-pointer items-center gap-2 rounded-lg bg-[#001B3D] px-3 py-2 text-sm text-white shadow-[0_4px_10px_rgba(0,0,0,0.25)] transition hover:bg-[#0A2B52] focus-within:ring-4 focus-within:ring-[#C79A3A]/50">
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8l-5-5zM14 3v5h5" />
    </svg>
    <span>Upload File</span>
    {{ field }}
  </label>
  <span x-show="name" x-cloak x-text="name" class="min-w-0 break-all text-sm text-[#333333]"></span>
</div>
