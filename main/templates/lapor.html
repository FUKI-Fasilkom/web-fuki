{% extends 'base.html' %}
{% load static %}

{% block title %}Laporkan Masalah{% endblock %}

{% block content %}
  {% include 'header.html' with page_title="Laporkan Masalah" %}

  <div class="w-full bg-[#F6FAEB] py-16 px-6 sm:px-12">
    <form
      x-data="laporForm()"
      x-on:submit.prevent="submit"
      class="max-w-2xl mx-auto flex flex-col gap-5"
      novalidate
    >
      {% csrf_token %}

      <!-- Email -->
      <div>
        <label for="email" class="block mb-2 text-[#3A3A3A]">
          Email <span class="text-[#3A3A3A]/50 text-sm">(opsional)</span>
        </label>
        <input id="email" name="email" type="email"
               placeholder="example23@email.com"
               class="w-full h-14 px-6 rounded-full border-2 border-[#3A3A3A] bg-[#F6FAEB] text-[#3A3A3A] placeholder-[#3A3A3A]/40 focus:outline-none focus:ring-2 focus:ring-[#B7D66B]" />
      </div>

      <!-- Nama (opsional) -->
      <div>
        <label for="nama" class="block mb-2 text-[#3A3A3A]">
          Nama <span class="text-[#3A3A3A]/50 text-sm">(opsional)</span>
        </label>
        <input id="nama" name="nama" type="text"
               placeholder="Tulis nama di sini"
               class="w-full h-14 px-6 rounded-full border-2 border-[#3A3A3A] bg-[#F6FAEB] text-[#3A3A3A] placeholder-[#3A3A3A]/40 focus:outline-none focus:ring-2 focus:ring-[#B7D66B]" />
      </div>

      <!-- Judul Pelaporan -->
      <div>
        <label for="judul" class="block mb-2 text-[#3A3A3A]">Judul Pelaporan</label>
        <input id="judul" name="judul" type="text" required
               placeholder="Tulis judul pelaporan di sini"
               class="w-full h-14 px-6 rounded-full border-2 border-[#3A3A3A] bg-[#F6FAEB] text-[#3A3A3A] placeholder-[#3A3A3A]/40 focus:outline-none focus:ring-2 focus:ring-[#B7D66B]" />
      </div>

      <!-- Jenis Laporan -->
      <div>
        <label for="jenis" class="block mb-2 text-[#3A3A3A]">Jenis Laporan</label>
        <div class="relative">
          <select id="jenis" name="jenis" required
                  class="w-full h-14 pl-6 pr-12 appearance-none rounded-full border-2 border-[#3A3A3A] bg-[#F6FAEB] text-[#3A3A3A] focus:outline-none focus:ring-2 focus:ring-[#B7D66B]">
            <option value="" disabled selected>Pilih jenis laporan</option>
            <option value="Bug">Bug</option>
            <option value="Isi Konten">Isi Konten</option>
          </select>
          <svg class="w-5 h-5 absolute right-6 top-1/2 -translate-y-1/2 pointer-events-none" fill="none"
               stroke="#3A3A3A" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>

      <!-- Deskripsi Masalah -->
      <div>
        <label for="deskripsi" class="block mb-2 text-[#3A3A3A]">Deskripsi Masalah</label>
        <textarea id="deskripsi" name="deskripsi" rows="5" required
                  placeholder="Tulis pesan di sini"
                  class="w-full px-6 py-4 rounded-[2rem] border-2 border-[#3A3A3A] bg-[#F6FAEB] text-[#3A3A3A] placeholder-[#3A3A3A]/40 resize-none focus:outline-none focus:ring-2 focus:ring-[#B7D66B]"></textarea>
      </div>

      <!-- Dokumentasi (opsional) -->
      <div>
        <label class="block mb-2 text-[#3A3A3A]">
          Dokumentasi <span class="text-[#3A3A3A]/50 text-sm">(opsional)</span>
        </label>
        <label
          x-on:dragover.prevent="dragging = true"
          x-on:dragleave.prevent="dragging = false"
          x-on:drop.prevent="dragging = false; pickFiles($event.dataTransfer.files)"
          x-bind:class="dragging ? 'bg-[#E6F0CC]' : 'bg-[#F6FAEB]'"
          class="flex flex-col items-center justify-center w-full max-w-md min-h-[280px] p-6 rounded-3xl border-2 border-[#3A3A3A] cursor-pointer transition-colors"
        >
          <input type="file" accept="image/*" class="hidden"
                 x-ref="file" x-on:change="pickFiles($event.target.files)" />

          <template x-if="!previewUrl">
            <div class="flex flex-col items-center text-center">
              <svg class="w-16 h-16 mb-4" fill="none" stroke="#8A8F7A" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M3 7.5A1.5 1.5 0 014.5 6h4.19a1.5 1.5 0 011.06.44l1.31 1.31h8.44A1.5 1.5 0 0121 9.25v8.25A1.5 1.5 0 0119.5 19h-15A1.5 1.5 0 013 17.5v-10z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 13h6m0 0l-2.25-2.25M14 13l-2.25 2.25" />
              </svg>
              <span class="text-[#8A8F7A]">Input atau seret gambar di sini</span>
            </div>
          </template>

          <template x-if="previewUrl">
            <div class="flex flex-col items-center text-center gap-3 w-full">
              <img x-bind:src="previewUrl" alt="Pratinjau dokumentasi"
                   class="max-h-40 rounded-2xl object-contain" />
              <span class="text-sm text-[#3A3A3A] break-all" x-text="fileName"></span>
              <button type="button" x-on:click.prevent.stop="clearFile"
                      class="text-sm underline text-[#3A3A3A]/70 hover:text-[#3A3A3A]">
                Hapus gambar
              </button>
            </div>
          </template>
        </label>
      </div>

      <!-- Status -->
      <p x-show="message" x-cloak x-text="message"
         x-bind:class="error ? 'text-red-600' : 'text-green-700'"
         class="text-sm"></p>

      <!-- Aksi -->
      <div class="flex items-center gap-4">
        <button type="button" x-on:click="reset"
                class="h-12 px-10 rounded-full border-2 border-[#3A3A3A] bg-transparent text-[#3A3A3A] hover:bg-[#3A3A3A]/5 transition-colors">
          Batal
        </button>
        <button type="submit" x-bind:disabled="loading"
                class="h-12 px-10 rounded-full border-2 border-[#B7D66B] bg-[#C8E08A] text-[#3A3A3A] hover:brightness-95 disabled:opacity-60 disabled:cursor-not-allowed transition">
          <span x-show="!loading">Kirim</span>
          <span x-show="loading" x-cloak class="flex items-center gap-2">
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            Mengirim...
          </span>
        </button>
      </div>
    </form>
  </div>

  <style>[x-cloak] { display: none !important; }</style>

  <script>
    function laporForm() {
      return {
        loading: false,
        dragging: false,
        message: '',
        error: false,
        fileName: '',
        previewUrl: '',

        pickFiles(fileList) {
          const file = fileList && fileList[0];
          if (!file || !file.type.startsWith('image/')) return;
          // Keep the hidden input authoritative so a dropped file is submitted too.
          const transfer = new DataTransfer();
          transfer.items.add(file);
          this.$refs.file.files = transfer.files;
          this.fileName = file.name;
          if (this.previewUrl) URL.revokeObjectURL(this.previewUrl);
          this.previewUrl = URL.createObjectURL(file);
        },

        clearFile() {
          this.$refs.file.value = '';
          if (this.previewUrl) URL.revokeObjectURL(this.previewUrl);
          this.previewUrl = '';
          this.fileName = '';
        },

        reset() {
          this.$el.reset();
          this.clearFile();
          this.message = '';
          this.error = false;
        },

        async submit() {
          if (!this.$el.reportValidity()) return;

          this.loading = true;
          this.message = '';
          this.error = false;

          const formData = new FormData(this.$el);
          const file = this.$refs.file.files[0];
          if (file) formData.append('gambar', file);

          try {
            const response = await fetch("{% url 'lapor_submit' %}", {
              method: 'POST',
              headers: { 'X-CSRFToken': formData.get('csrfmiddlewaretoken') },
              body: formData,
            });
            const data = await response.json().catch(() => ({}));

            if (!response.ok || !data.ok) {
              throw new Error(data.error || 'Gagal mengirim laporan.');
            }

            this.reset();
            this.message = 'Terima kasih! Laporan kamu sudah terkirim.';
          } catch (err) {
            this.error = true;
            this.message = err.message;
          } finally {
            this.loading = false;
          }
        },
      };
    }
  </script>
{% endblock %}
