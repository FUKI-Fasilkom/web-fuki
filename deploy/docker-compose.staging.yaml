services:
  web:
    image: ghcr.io/fuki-fasilkom/web-fuki:${IMAGE_TAG}
    container_name: staging_web
    # app.env, not .env: Compose interpolates $ inside .env, which would corrupt
    # DJANGO_SECRET. app.env is passed through to the container verbatim.
    env_file: app.env
    volumes:
      - staging_media:/app/media
      # STATIC_ROOT is /app/staticfiles; nginx mounts this same volume read-only
      # at /app/static, which is where its `alias` points.
      - staging_static:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [staging_net]
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: staging_db
    # Explicit vars rather than `env_file: .env` so the database container is not
    # handed DJANGO_SECRET and the rest of the application's environment.
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [staging_net]
    restart: unless-stopped

  nginx:
    # Pinned: `latest` was re-pulled on every deploy, so an upstream major bump
    # could break staging on a deploy that changed nothing in this repo.
    image: nginx:1.27-alpine
    container_name: staging_nginx
    ports:
      - "8080:80"          # port beda dari production, sampai subdomain fix
    volumes:
      - staging_static:/app/static:ro
      - staging_media:/app/media:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web]
    networks: [staging_net]
    restart: unless-stopped

networks:
  staging_net:

volumes:
  staging_pgdata:
  staging_static:
  staging_media:
