services:
  web:
    image: ghcr.io/OWNER/REPO:${IMAGE_TAG}
    container_name: staging_web
    env_file: .env
    volumes:
      - staging_media:/app/media
      - staging_static:/app/static
    expose:
      - "8000"
    networks: [staging_net]
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: staging_db
    env_file: .env
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    networks: [staging_net]
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: staging_nginx
    ports:
      - "8080:80"          # port beda dari production, sampai subdomain fix
    volumes:
      - staging_static:/app/static:ro
      - staging_media:/app/media:ro
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web]
    networks: [staging_net]
    restart: unless-stopped

networks:
  staging_net:

volumes:
  staging_pgdata:
  staging_static:
  staging_media: