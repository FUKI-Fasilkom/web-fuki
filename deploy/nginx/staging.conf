map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name staging-fuki.cs.ui.ac.id localhost;

    # Django admin image uploads (kegiatan/profil) exceed nginx's 1m default.
    client_max_body_size 20m;

    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "FUKI Staging";
    auth_basic_user_file /etc/nginx/.htpasswd;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    # Serve the .gz files WhiteNoise's CompressedStaticFilesStorage already wrote.
    gzip_static on;

    location = /robots.txt {
        auth_basic off;
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /static/ {
        alias /app/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Jawaban tugas mengandung data peserta dan hanya boleh diunduh melalui
    # endpoint Django yang memeriksa pemilik/mentor penanggung jawab.
    location /media/siwak/tugas/ {
        internal;
        alias /app/media/siwak/tugas/;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /health/ {
        auth_basic off;
        access_log off;
        proxy_pass http://web:8000/health/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
