{% comment %}Ikon bagian panel. Parameter: nama, kelas.{% endcomment %}
{% if nama == 'informasi' %}
<svg class="{{ kelas }}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
  <circle cx="12" cy="12" r="9" /><path stroke-linecap="round" d="M12 11v5M12 8h.01" />
</svg>
{% elif nama == 'kalender' %}
<svg class="{{ kelas }}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
  <rect x="3" y="5" width="18" height="16" rx="2" /><path stroke-linecap="round" d="M8 3v4M16 3v4M3 10h18" />
</svg>
{% elif nama == 'orang' %}
<svg class="{{ kelas }}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
  <circle cx="9" cy="8" r="3.5" /><path stroke-linecap="round" d="M2.5 20a6.5 6.5 0 0 1 13 0M17 11.5a3 3 0 1 0-2-5.3M18 20a5.6 5.6 0 0 0-2.2-4.4" />
</svg>
{% elif nama == 'tiket' %}
<svg class="{{ kelas }}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
  <path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z" />
  <path stroke-linecap="round" stroke-dasharray="2 3" d="M13 6v12" />
</svg>
{% else %}
<svg class="{{ kelas }}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
  <rect x="4" y="4" width="16" height="16" rx="3" />
</svg>
{% endif %}
