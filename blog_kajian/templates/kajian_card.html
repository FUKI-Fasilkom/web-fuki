<a href="{% url 'kajian_detail' kajian.id %}" class="group block overflow-hidden rounded-2xl bg-white shadow-[0_8px_32px_rgba(0,27,61,0.10)] transition duration-300 hover:-translate-y-1 hover:shadow-[0_16px_36px_rgba(0,27,61,0.16)] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#001B3D]">
  <div class="aspect-[4/3] overflow-hidden bg-[#E5E7EB]">
    {% if kajian.image %}
      <img src="{{ kajian.image.url }}" alt="{{ kajian.judul }}" loading="lazy" class="h-full w-full object-cover transition duration-500 group-hover:scale-105" />
    {% else %}
      <div class="flex h-full items-center justify-center bg-[#E8DCB0] px-6 text-center text-sm font-medium text-[#7A6425]">Kajian FUKI</div>
    {% endif %}
  </div>
  <div class="min-h-[162px] bg-[linear-gradient(138deg,#001B3D_12%,#0048A3_165%)] px-6 py-6 text-white sm:px-7">
    <h3 class="line-clamp-2 text-xl font-bold leading-[1.5]">{{ kajian.judul }}</h3>
    <p class="mt-3 text-sm leading-relaxed text-[#E8EEF8]">{{ kajian.penceramah }}</p>
    <p class="mt-1 text-sm text-[#E8EEF8]">{{ kajian.tanggal|date:'j F Y' }}</p>
  </div>
</a>
