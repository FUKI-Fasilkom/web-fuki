# Resolver internal Docker. WAJIB dipakai bersama upstream berbasis variabel:
# tanpa ini nginx me-resolve staging_nginx saat memuat config, dan kalau staging
# sedang mati production_nginx GAGAL START — produksi ikut tumbang.
resolver 127.0.0.11 valid=10s;

# Apache menerminasi TLS lalu meneruskan ke VPS lewat HTTP biasa, jadi $scheme di
# hop ini selalu "http". Menimpanya akan menghapus informasi https dari Apache dan
# membuat Django mengira koneksinya tidak aman.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;                  # health check lokal, tidak lewat Apache
}

# Host tak dikenal ditutup, bukan dilempar ke produksi.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    # `localhost` is listed so the deploy health check (curl http://localhost/health/)
    # matches this block explicitly rather than relying on default_server fallback.
    server_name fuki.cs.ui.ac.id localhost;

    # Django admin image uploads (kegiatan/profil) exceed nginx's 1m default.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    # Serve the .gz files WhiteNoise's CompressedStaticFilesStorage already wrote.
    gzip_static on;

    location /static/ {
        alias /app/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Jawaban tugas mengandung data peserta dan hanya boleh diunduh melalui
    # endpoint Django yang memeriksa pemilik/mentor penanggung jawab.
    location /media/siwak/tugas/ {
        internal;
        alias /app/media/siwak/tugas/;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /health/ {
        access_log off;
        proxy_pass http://web:8000/health/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name staging-fuki.cs.ui.ac.id;
    client_max_body_size 20m;

    location / {
        set $staging_host staging_nginx;
        proxy_pass http://$staging_host:80$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
