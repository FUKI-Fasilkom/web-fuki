{% extends 'base.html' %}
{% load static %}

{% block title %}404 Not Found{% endblock %}

{% block content %}
    <!-- Menjadikan tulisan 404 sebagai Page Title di header -->
    {% include 'header.html' with page_title="404: Page Not Found" %}
    
    <div class="relative w-full min-h-[60vh] bg-[#F8FBEF] overflow-hidden flex items-center justify-center pb-24">
        <div class="text-center px-6 -mt-8">
            <p class="text-xl sm:text-2xl text-gray-700 mb-10 max-w-2xl mx-auto leading-relaxed">
                Oops! Halaman yang kamu cari tidak dapat ditemukan atau mungkin sudah dipindahkan.
            </p>
            <a href="/" class="inline-block px-10 py-4 bg-[#A6CE39] text-[#3A3A3A] text-lg font-bold rounded-full hover:bg-[#c1df68] transition-all border-[3px] border-[#3A3A3A] shadow-[0_8px_0_0_#3A3A3A] hover:shadow-[0_4px_0_0_#3A3A3A] hover:translate-y-1">
                Kembali ke Beranda
            </a>
        </div>
    </div>
{% endblock %}
