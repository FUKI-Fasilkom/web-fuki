server {
    listen 80 default_server;
    # `localhost` is listed so the deploy health check (curl http://localhost/health/)
    # matches this block explicitly rather than relying on default_server fallback.
    server_name fuki.cs.ui.ac.id localhost;

    # Django admin image uploads (kegiatan/profil) exceed nginx's 1m default.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    # Serve the .gz files WhiteNoise's CompressedStaticFilesStorage already wrote.
    gzip_static on;

    location /static/ {
        alias /app/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /health/ {
        access_log off;
        proxy_pass http://web:8000/health/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
